stages:
  data_collection:
    cmd: python src/data_collection.py
    deps:
    - src/data_collection.py
    params:
    - data_collection.dataset
    - data_collection.raw_data_dir
    - data_collection.random_seed
    outs:
    - data/raw

  data_processing:
    cmd: python src/data_processing.py
    deps:
      - src/data_processing.py
      - data/raw
    params:
      - data_collection.raw_data_dir
      - data_collection.random_seed
      - data_processing.image_size
      - data_processing.grayscale
      - data_processing.normalize
      - data_processing.test_split
      - data_processing.val_split
      - data_processing.augmentation.enabled
      - data_processing.augmentation.rotation_range
      - data_processing.augmentation.horizontal_flip
      - data_processing.augmentation.zoom_range
    outs:
      - data/processed

  feature_selection:
    cmd: python src/feature_selection.py
    deps:
      - src/feature_selection.py
      - data/processed
    params:
      - feature_selection.method
      - feature_selection.num_features
      - feature_selection.variance_threshold
    outs:
      - data/features
      - models/feature_selector.joblib

  model_training:
    cmd: python src/model_training.py
    deps:
      - src/model_training.py
      - src/mlp.py
      - data/features
    params:
      - model_training.model_type
      - model_training.hidden_layers
      - model_training.learning_rate
      - model_training.batch_size
      - model_training.epochs
      - model_training.optimizer
      - model_training.dropout_rate
      - model_training.early_stopping_patience
      - model_training.random_seed
    outs:
      - models/model.joblib
    metrics:
      - metrics/train_history.json:
          cache: false
    plots:
      - reports/training_curves.png:
          cache: false

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - models/model.joblib
      - data/features
    params:
      - model_evaluation.metrics
      - model_evaluation.confusion_matrix
    metrics:
      - metrics/eval_metrics.json:
          cache: false
    plots:
      - reports/confusion_matrix.png:
          cache: false