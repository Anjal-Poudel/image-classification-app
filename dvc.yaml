stages:
  data_collection:
    cmd: python src/data_collection.py
    deps:
    - src/data_collection.py
    params:
    - data_collection.dataset
    - data_collection.raw_data_dir
    - data_collection.random_seed
    outs:
    - data/raw

  data_processing:
    cmd: python src/data_processing.py
    deps:
      - src/data_processing.py
      - data/raw
    params:
      - data_collection.raw_data_dir
      - data_collection.random_seed
      - data_processing.image_size
      - data_processing.grayscale
      - data_processing.normalize
      - data_processing.test_split
      - data_processing.val_split
      - data_processing.augmentation.enabled
      - data_processing.augmentation.rotation_range
      - data_processing.augmentation.horizontal_flip
      - data_processing.augmentation.zoom_range
    outs:
      - data/processed
      
  feature_selection:
    cmd: python src/feature_selection.py
    deps:
      - src/feature_selection.py
      - data/processed
    params:
      - feature_selection.method
      - feature_selection.num_features
      - feature_selection.variance_threshold
    outs:
      - data/features
      - models/feature_selector.joblib
